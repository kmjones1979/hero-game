[package]
name = "hero_game"
version = "0.1.0"
description = "On-chain hero NFT minting program (PDA-based)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hero_game"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
solana-program = "2.3"

[dev-dependencies]
litesvm = "=0.7.1"
solana-sdk = "2.3"
